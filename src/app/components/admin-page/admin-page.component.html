<h1 class="elegant-title">Панель администрации сайта</h1>
<div class="button-group">
  <button class="styled-red-button" (click)="changeCreateNewPetWindowState()">Добавить нового зверька</button>
  <button class="styled-red-button" (click)="changeDeleteWindowState()">Удалить зверька</button>
  <button class="styled-red-button" (click)="changeAddShelterWindowState()">Добавить новый приют</button>
  <button class="styled-red-button" (click)="changeAddAnimalTypeWindowState()">Добавить новый вид зверька</button>
</div>
<div class="button-group">
  <button (click)="sortAnimalsBy('name')">Отсортировать по имени животного</button>
  <button (click)="sortAnimalsBy('description')">Отсортировать по описанию</button>
  <button (click)="sortAnimalsBy('animalType.name')">Отсортировать по типу зверушки</button>
  <button (click)="sortAnimalsBy('shelter.name')">Отсортировать по названию приюта</button>
</div>

<div class="main-container">
  <app-info-about-pet-for-admin *ngFor="let animal of animals" [infoAboutPet]="animal"></app-info-about-pet-for-admin>
</div>

<app-create-new-pet-window *ngIf="isCreateNewPetWindowOpen()" [shelters]="shelters"
                           [animalTypes]="animalTypes"></app-create-new-pet-window>
<app-delete-pet-window *ngIf="isDeletePetWindowOpen()"></app-delete-pet-window>
<app-add-new-shelter-window *ngIf="isAddNewShelterWindowOpen()"></app-add-new-shelter-window>
<app-add-new-animal-type-window *ngIf="isAddNewAnimalTypeWindowOpen()"></app-add-new-animal-type-window>
